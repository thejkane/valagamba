default:
  image: node:24-bookworm-slim
  interruptible: true

stages:
  - build

variables:
  ASTRO_TELEMETRY_DISABLED: "1"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Use the merge request pipeline instead of a duplicate branch pipeline.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

build_site:
  stage: build
  cache:
    key:
      prefix: node-24
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline --no-audit
    - npm run build
  artifacts:
    name: "valagamba-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    expire_in: 1 week
